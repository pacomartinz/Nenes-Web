<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Centro de desarrollo infantil. Acompañamos a cada peque y a su familia."
  >

  <title>ne.nes — Centro de desarrollo infantil</title>

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

 <link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Lora:wght@500&display=swap"
  rel="stylesheet"
>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page" id="inicio">

    <!-- ========================================
         HERO
    ========================================= -->
    <section class="hero">

      <!-- Foto principal -->
      <img
        class="hero__image"
        src="img/hero.jpg"
        alt="Profesional acompañando a una niña durante una actividad"
      >

      <!-- Capa cálida -->
      <div class="hero__overlay"></div>


      <!-- HEADER -->
      <header class="header">

        <div class="brand">

          <!-- LOGO REAL -->
          <a
            href="#inicio"
            class="brand__logo-link"
            aria-label="ne.nes - Inicio"
          >
            <img
              class="brand__logo"
              src="img/logo.png"
              alt="ne.nes"
            >
          </a>

          

        </div>


        <!-- Botón hamburguesa -->
        <button
          class="menu-button"
          type="button"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="main-menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

      </header>

    </section>


    <!-- ========================================
         BLOQUE INFERIOR
    ========================================= -->
    <section class="intro">

      <!-- Curva orgánica entre la foto y el contenido -->
<svg
  class="intro__wave"
  viewBox="0 0 1000 500"
  preserveAspectRatio="none"
  aria-hidden="true"
>
  <path
    d="
      M 0 20
      C 150 100, 300 70, 455 95
      C 610 120, 700 175, 760 285
      C 805 365, 820 395, 875 425
      C 925 452, 970 458, 1000 462
      L 1000 500
      L 0 500
      Z
    "
  />
</svg>

      <!-- Círculo amarillo -->
      <div
        class="intro__circle"
        aria-hidden="true"
      ></div>


      <!-- Tarjeta crema -->
      <div class="intro__card">

        <p class="intro__eyebrow">
          Centro de desarrollo infantil
        </p>

        <h1 class="intro__title">
          Acompañamos<br>
          a cada peque y<br>
          a su familia.
        </h1>

        <p class="intro__text">
          Con cercanía, especialización<br>
          y respeto por su desarrollo.
        </p>

        <a
          href="#contacto"
          class="appointment-link"
        >
          <span>Cuéntanos</span>

          <span
            class="appointment-link__arrow"
            aria-hidden="true"
          >
            →
          </span>
        </a>

      </div>

    </section>


    
  </main>


  <!-- ========================================
       FONDO DEL MENÚ
  ========================================= -->
  <div
    class="menu-backdrop"
    aria-hidden="true"
  ></div>


  <!-- ========================================
       MENÚ LATERAL
  ========================================= -->
 <nav
  class="menu"
  id="main-menu"
  aria-label="Navegación principal"
>

  <button
    class="menu__close"
    type="button"
    aria-label="Cerrar menú"
  >
    ×
  </button>

  <div class="menu__content">

    <ul class="menu__links">

      <li>
        <a href="#inicio">
          Inicio
        </a>
      </li>

      <li>
        <a href="#que-es-nenes">
          ¿Qué es nenes?
        </a>
      </li>

      <li>
        <a href="#servicios">
          Servicios
        </a>
      </li>

      <li>
        <a href="#espacio">
          Nuestro espacio
        </a>
      </li>

      <li>
        <a
          href="#familias"
          class="menu__link--active"
        >
          Para familias
        </a>
      </li>

      <li>
        <a href="#sobre-mi">
          Sobre mí
        </a>
      </li>

      <li>
        <a href="#informacion">
          Información práctica
        </a>
      </li>

    </ul>

  </div>

</nav>


  <script src="script.js"></script>

</body>
</html>
