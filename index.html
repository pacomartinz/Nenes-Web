<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Centro Nenes | Fisioterapia Pediátrica</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <header class="header">

        <a href="#" class="logo-link" aria-label="Centro Nenes">
            <img
                src="img/logo.png"
                alt="Nenes - Centro de Fisioterapia Pediátrica"
                class="logo"
            >
        </a>


        <button
            class="menu-toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="main-nav"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <nav class="nav" id="main-nav">

            <a href="#inicio">Inicio</a>
            <a href="#servicios">Servicios</a>
            <a href="#centro">El centro</a>
            <a href="#contacto">Contacto</a>

        </nav>

    </header>



    <main>

        <section class="hero" id="inicio">

            <div class="hero-content">

                <h1>
                    Centro de desarrollo<br>
                    infantil<span class="dot">.</span>
                </h1>


                <p class="hero-text">
                    Acompañamos a cada peque y a su familia
                    con cercanía, especialización y respeto
                    por su desarrollo.
                </p>


                

            </div>



            <div class="hero-visual">

                <!-- círculo dorado de fondo -->
                <div class="gold-shape"></div>

                <!-- círculo coral -->
                <div class="coral-dot"></div>


                <div class="hero-image-wrapper">

                    <img
                        src="img/hero.jpg"
                        alt="Fisioterapia pediátrica en Centro Nenes"
                        class="hero-image"
                    >

                </div>

            </div>

        </section>

    </main>



    <script src="script.js"></script>

</body>

</html>
